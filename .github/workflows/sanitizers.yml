name: CI Sanitizers

on:
  push:
    branches: [ "main", "v*.*.x" ]
    paths:
      - '.github/workflows/**'
      - '**.cpp'
      - '**.hpp'
      - '**.txt'
  pull_request:
    branches: [ "main", "v*.*.x" ]

env:
  BUILD_TYPE: Debug
  SAMPLE_ASSETS_LOCATION: tests/gltf/glTF-Sample-Assets
  SANITIZER_FLAGS: -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer

jobs:
  build_linux_sanitizers:
    name: ASan + UBSan

    runs-on: ubuntu-26.04
    env:
      CC: clang-22
      CXX: clang++-22
      # On Linux, ASan also includes LeakSanitizer, which is enabled by default.
      ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:strict_string_checks=1:check_initialization_order=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v7

      - name: Download cached sample assets
        uses: actions/cache@v5
        id: sample-assets-cache
        with:
          path: ${{ github.workspace }}/${{ env.SAMPLE_ASSETS_LOCATION }}
          key: gltf-sample-assets

      - name: Clone gltf-sample-assets
        if: steps.sample-assets-cache.outputs.cache-hit != 'true'
        run: git clone https://github.com/KhronosGroup/glTF-Sample-Assets ${{ github.workspace }}/${{ env.SAMPLE_ASSETS_LOCATION }}

      - name: Configure CMake
        run: >
          cmake -B ${{ github.workspace }}/build
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DFASTGLTF_ENABLE_TESTS=ON
          -DFASTGLTF_USE_CUSTOM_SMALLVECTOR=${{ matrix.custom_small_vector }}
          "-DCMAKE_C_FLAGS=${{ env.SANITIZER_FLAGS }}"
          "-DCMAKE_CXX_FLAGS=${{ env.SANITIZER_FLAGS }}"

      - name: Build
        run: cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }} --target fastgltf_tests --verbose

      - name: Run tests
        run: ${{ github.workspace }}/build/tests/fastgltf_tests -d yes --order lex
