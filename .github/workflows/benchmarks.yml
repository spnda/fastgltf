name: Benchmarks

on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/benchmarks.yml'
      - '**.cpp'
      - '**.hpp'
      - '**.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: benchmarks
  cancel-in-progress: false

env:
  BUILD_TYPE: Release
  SAMPLE_ASSETS_LOCATION: tests/gltf/glTF-Sample-Assets

jobs:
  benchmark:
    name: benchmark (${{ matrix.name }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { os: ubuntu-24.04, name: Linux x64 }
          - { os: ubuntu-24.04-arm, name: Linux arm64 }

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Download cached sample assets
        uses: actions/cache@v5
        id: sample-assets-cache
        with:
          path: ${{ github.workspace }}/${{ env.SAMPLE_ASSETS_LOCATION }}
          key: gltf-sample-assets

      - name: Clone gltf-sample-assets
        if: steps.sample-assets-cache.outputs.cache-hit != 'true'
        run: git clone https://github.com/KhronosGroup/glTF-Sample-Assets ${{ github.workspace }}/${{ env.SAMPLE_ASSETS_LOCATION }}

      - name: Configure CMake
        run: cmake -B ${{ github.workspace }}/build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DFASTGLTF_ENABLE_TESTS=ON

      - name: Build
        run: cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }} --target fastgltf_tests

      # github-action-benchmark parses Catch2's default console output, so don't change the reporter.
      - name: Run benchmarks
        run: |
          ${{ github.workspace }}/build/tests/fastgltf_tests "[gltf-benchmark],[crc-benchmark]" --benchmark-samples 50 | tee benchmark_result.txt

      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: fastgltf (${{ matrix.name }})
          tool: catch2
          output-file-path: benchmark_result.txt
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
          summary-always: true
